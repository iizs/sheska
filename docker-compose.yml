services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - source-store:/app/source-store
      - wiki-store:/app/wiki-store
      - ./prompts:/app/prompts
    depends_on: []
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - wiki-store:/wiki-store
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  source-store:
  wiki-store:
